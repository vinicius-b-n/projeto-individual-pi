<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Controle</title>
    <link rel="stylesheet" href="css/dash.css" />
    <link rel="stylesheet" href="navbar.css" />
</head>

<body>
    <!-- <div id="navbar"></div> -->

    <div class="container_painel">
        <div class="barra_usuario">
            <div class="nome_usuario">
                <span>Olá</span>
                <span id="nome_usuario">pedro</span>
                <span>, bem vindo de volta a administração.</span>
            </div>
            <button onclick="encerrar()" class="botao_sair">Sair</button>
        </div>

        <div class="topo_cabecalho">
            <div class="icone_caveira">
                <img src="assets/imgs/img_quiz/caveira_soul_eater.png" alt="" />
            </div>
            <span class="titulo_painel">Painel de Controle</span>
            <div class="icone_caveira">
                <img src="assets/imgs/img_quiz/caveira_soul_eater.png" alt="" />
            </div>
        </div>

        <div class="grade_cards_kpi">
            <div class="card_kpi">
                <span class="card_kpi_titulo">Nota média da avaliação</span>
                <span class="card_kpi_valor" id="card_kpi_nota_media"></span>
                <div class="card_kpi_icone">
                    <img src="assets/imgs/img_dash/star.png" alt="" />
                </div>
            </div>

            <div class="card_kpi">
                <span class="card_kpi_titulo">Quantidade de Cadastros</span>
                <span class="card_kpi_valor" id="card_kpi_qtd_cadastro"></span>
                <div class="card_kpi_icone">
                    <img src="assets/imgs/img_dash/user.png" alt="" />
                </div>
            </div>

            <div class="card_kpi">
                <span class="card_kpi_titulo">Quantidade de Avaliações</span>
                <span class="card_kpi_valor" id="card_kpi_qtd_avaliacao"></span>
                <div class="card_kpi_icone">
                    <img src="assets/imgs/img_dash/businessman.png" alt="" />
                </div>
            </div>

            <div class="card_kpi">
                <span class="card_kpi_titulo">Mês com mais cadastros</span>
                <span class="card_kpi_valor" id="card_kpi_mes"><br /></span>
                <span class="card_kpi_valor_2" id="card_kpi_mais_cadastro"></span>
            </div>
        </div>

        <div class="card_grafico">
            <span class="card_grafico_titulo">Quantidade de Cadastros por Mês</span>
            <div class="area_grafico">
                <canvas id="area_grafico_meses"></canvas>
            </div>
        </div>

        <!-- <div class="layout_inferior">
            <div class="coluna_lateral_avaliacao">
                <div class="card_avaliacao">
                    <span class="card_avaliacao_titulo">Resultado mais comum no quiz:</span>
                    <span class="card_avaliacao_tag">personagem</span>
                    <div class="area_imagem">
                        <span>personagem imagem</span>
                    </div>
                </div>

                <div class="card_avaliacao">
                    <span class="card_avaliacao_titulo">Resultado menos comum no quiz:</span>
                    <span class="card_avaliacao_tag">personagem</span>
                    <div class="area_imagem">
                        <span>personagem imagem</span>
                    </div>
                </div>
            </div> -->

        <div class="coluna_grafico_principal">
            <div class="card_grafico">
                <span class="card_grafico_titulo">Quantidade de cada resultado do Quiz</span>
                <div">
                    <canvas id="area_grafico_resultados"></canvas>
            </div>
        </div>
    </div>
    </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    //   fetch("navbar.html")
    //   .then(response => response.text())
    //   .then(data => {
    //     document.getElementById("navbar").innerHTML = data;
    //   });

    window.onload = nomear;

    function nomear() {
        var nome = sessionStorage.getItem("NOME_USUARIO");
        var elementoUsuario = document.getElementById("nome_usuario");
        elementoUsuario.innerHTML = nome;
    }

    function encerrar() {

        sessionStorage.clear();


        window.location.href = "index.html";
    }


    fetch("/dash/nota_media")
        .then((response) => response.json())
        .then((avaliacao) => {
            console.log(
                "O que o servidor respondeu em media avaliacao:",
                avaliacao,
            );

            var kpi_nota_media = document.getElementById("card_kpi_nota_media");
            kpi_nota_media.innerHTML = `${avaliacao[0].nota}`;
        })
        .catch((error) => console.error("erro ao carregar nota média", error));

    fetch("/dash/qtd_cadastro")
        .then((response) => response.json())
        .then((cadastros) => {
            console.log("O que o servidor respondeu em qtd cadastro:", cadastros);

            var kpi_qtd_cadastro = document.getElementById("card_kpi_qtd_cadastro");
            kpi_qtd_cadastro.innerHTML = `${cadastros[0].qtd_usuarios}`;
        })
        .catch((error) =>
            console.error("erro ao carregar quantidade de cadastro", error),
        );

    fetch("/dash/qtd_avaliacao")
        .then((response) => response.json())
        .then((avaliacoes) => {
            console.log("O que o servidor respondeu em qtd avaliacao:", avaliacoes);

            var kpi_qtd_avaliacao = document.getElementById(
                "card_kpi_qtd_avaliacao",
            );
            kpi_qtd_avaliacao.innerHTML = `${avaliacoes[0].qtd_avaliacoes}`;
        })
        .catch((error) =>
            console.error("erro ao carregar quantidade de avaliacoes", error),
        );

    function conversao_mes(numeroMes) {
        var kpi_mes = document.getElementById("card_kpi_mes");
        if (numeroMes == 1) {
            kpi_mes.innerHTML = `Janeiro`;
        } else if (numeroMes == 2) {
            kpi_mes.innerHTML = `Fevereiro`;
        } else if (numeroMes == 3) {
            kpi_mes.innerHTML = `Março`;
        } else if (numeroMes == 4) {
            kpi_mes.innerHTML = `Abril`;
        } else if (numeroMes == 5) {
            kpi_mes.innerHTML = `maio`;
        } else if (numeroMes == 6) {
            kpi_mes.innerHTML = `Junho`;
        } else if (numeroMes == 7) {
            kpi_mes.innerHTML = `Julho`;
        } else if (numeroMes == 8) {
            kpi_mes.innerHTML = `Agosto`;
        } else if (numeroMes == 9) {
            kpi_mes.innerHTML = `Setembro`;
        } else if (numeroMes == 10) {
            kpi_mes.innerHTML = `Outubro`;
        } else if (numeroMes == 11) {
            kpi_mes.innerHTML = `Novembro`;
        } else if (numeroMes == 12) {
            kpi_mes.innerHTML = `Dezembro`;
        }
    }

    fetch("/dash/mais_cadastro")
        .then((response) => response.json())
        .then((mes_cadastro) => {
            console.log(
                "O que o servidor respondeu em media avaliacao:",
                mes_cadastro,
            );

            var kpi_mais_cadastro = document.getElementById(
                "card_kpi_mais_cadastro",
            );
            var numeroMes = mes_cadastro[0].mais_cadastro;
            kpi_mais_cadastro.innerHTML = `${mes_cadastro[0].mais_cadastro}`;

            conversao_mes(numeroMes);
        })
        .catch((error) =>
            console.error("erro ao carregar mes com mais cadastros", error),
        );

    ///////////////////////////////////

    fetch("/dash/cadastro_meses")
        .then((response) => response.json())
        .then((meses) => {
            console.log("O que o servidor respondeu em cadastro meses:", meses);

            plotar_grafico_meses(meses);
        })
        .catch((error) =>
            console.error(
                "erro ao carregar meses e seus respctivos cadastros",
                error,
            ),
        );

    function plotar_grafico_meses(meses) {
        const labelsG2 = [];
        console.log(labelsG2);

        // for (let i = 0; i < meses.length; i++) {
        //     labelsG2.push(meses[i].data)
        // }
        const dataG2 = {
            labels: labelsG2,
            datasets: [
                {
                    label: "Cadastros",
                    backgroundColor: "rgb(235, 7, 1)",
                    borderColor: "rgb(235, 7, 1)",
                    data: [],
                },
            ],
        };

        console.log(dataG2.datasets[0].data);
        for (let i = 0; i < meses.length; i++) {
            if (meses[i].mes == 1) {
                labelsG2.push("Janeiro");
            } else if (meses[i].mes == 2) {
                labelsG2.push("Fevereiro");
            } else if (meses[i].mes == 3) {
                labelsG2.push("Março");
            } else if (meses[i].mes == 4) {
                labelsG2.push("Abril");
            } else if (meses[i].mes == 5) {
                labelsG2.push("Maio");
            } else if (meses[i].mes == 6) {
                labelsG2.push("Junho");
            } else if (meses[i].mes == 7) {
                labelsG2.push("Julho");
            } else if (meses[i].mes == 8) {
                labelsG2.push("Agosto");
            } else if (meses[i].mes == 9) {
                labelsG2.push("Setembro");
            } else if (meses[i].mes == 10) {
                labelsG2.push("Outubro");
            } else if (meses[i].mes == 11) {
                labelsG2.push("Novembro");
            } else if (meses[i].mes == 12) {
                labelsG2.push("Dezembro");
            }
        }

        for (let i = 0; i < meses.length; i++) {
            dataG2.datasets[0].data.push(meses[i].qtd_cadastros);
        }
        const configG2 = {
            type: "line",
            data: dataG2,
            options: {
                maintainAspectRatio: false, // PERMITE QUE O GRÁFICO ESTIQUE NA VERTICAL
                responsive: true,
                scales: {
                    y: {
                        min: 0,
                        max: 10,
                        stacked: true,
                    },
                    x: {
                        stacked: true,
                        offset: true,
                    },
                },
            },
        };

        const grafico_meses = new Chart(
            document.getElementById("area_grafico_meses"),
            configG2,
        );
    }


    /////////////////////////////////


    fetch("/dash/qtd_resultado")
        .then((response) => response.json())
        .then((resultados) => {
            console.log("O que o servidor respondeu em resultados:", resultados);



            plotar_grafico_resultados(resultados);
        })
        .catch((error) =>
            console.error("erro ao carregar quantidade de resultados", error),
        );

    function plotar_grafico_resultados(resultados) {


        const labels = [
            "Maka",
            "Soul",
            "Black Star",
            "Tsubaki",
            "Kid",
            "Liz",
            "Patty",
            "Crona",
        ];
        const data = {
            labels: labels,
            datasets: [
                {
                    // label: "Número de resultados",
                    data: [],
                    backgroundColor: [
                        "rgba(255, 0, 0, 1)",
                        "rgba(239, 184, 16, 1)",
                        "rgba(135, 206, 235, 1)",
                        "rgba(128, 128, 128, 1)",
                        "rgba(0, 0, 0, 1)",
                        "rgba(250, 128, 114, 1)",
                        "rgba(255, 192, 203, 1)",
                        "rgb(216, 191, 216, 1)",
                    ],
                    borderColor: [
                        "rgb(255, 99, 132)",
                        "rgb(255, 159, 64)",
                        "rgb(255, 205, 86)",
                        "rgb(75, 192, 192)",
                        "rgb(54, 162, 235)",
                        "rgb(153, 102, 255)",
                        "rgb(201, 203, 207)",
                        "rgb(244, 203, 207)",
                    ],
                    borderWidth: 1,
                },
            ],
        };


        for (let i = 0; i < resultados.length; i++) {
            if (resultados[i].fk_resultado == 1) {
                data.datasets[0].data[0] = resultados[i].qtd_resultado;
            }
            else if (resultados[i].fk_resultado == 2) {
                data.datasets[0].data[1] = resultados[i].qtd_resultado;
            }
            else if (resultados[i].fk_resultado == 3) {
                data.datasets[0].data[2] = resultados[i].qtd_resultado;
            }
            else if (resultados[i].fk_resultado == 4) {
                data.datasets[0].data[3] = resultados[i].qtd_resultado;
            }
            else if (resultados[i].fk_resultado == 5) {
                data.datasets[0].data[4] = resultados[i].qtd_resultado;
            }
            else if (resultados[i].fk_resultado == 6) {
                data.datasets[0].data[5] = resultados[i].qtd_resultado;
            }
            else if (resultados[i].fk_resultado == 7) {
                data.datasets[0].data[6] = resultados[i].qtd_resultado;
            }
            else if (resultados[i].fk_resultado == 8) {
                data.datasets[0].data[7] = resultados[i].qtd_resultado;
            }
        }


        const config = {
            type: "bar",
            data: data,
            options: {
                plugins: {
                    legend: {


                        display: false,

                    }
                },

                scales: {
                    y: {
                        // beginAtZero: true,
                        min: 0,
                        max: 10,
                        stacked: true,
                    },
                },
            },
        };


        const grafico_resultados = new Chart(
            document.getElementById("area_grafico_resultados"),
            config,
        );
    }
</script>

</html>
