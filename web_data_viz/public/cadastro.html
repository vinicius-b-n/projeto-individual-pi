fetch("navbar.html")
  .then((response) => response.text())
  .then((data) => {
    document.getElementById("navbar").innerHTML = data;

    atualizarNavbar(); 
  });


function atualizarNavbar() {
  var id_user = sessionStorage.getItem("ID_USUARIO");
  
  var botao_login = document.getElementById("login");
  var botao_cadastro = document.getElementById("cadastro");
  var botao_sair = document.getElementById("sair");

    if (id_user != null && Number(id_user) >= 1) {
      botao_login.style.display = "none";
      botao_cadastro.style.display = "none";
      botao_sair.style.display = "block";
    } else {
      botao_login.style.display = "block";
      botao_cadastro.style.display = "block";
      botao_sair.style.display = "none";
    }
}



function encerrar() {
  sessionStorage.clear();
  window.location.reload();
}
//navbar fim

    // Array para armazenar empresas cadastradas para validação de código de ativação 
  
    // let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_inserido.value;
    var emailVar = email_inserido.value;
    var senhaVar = senha_inserida.value;
    var confirmacaoSenhaVar = confirmar_senha_inserida.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Preencha todos os campos)";

      finalizarAguardar(); 
      return false;

      
    } 
    
    else if (senhaVar != confirmacaoSenhaVar) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(confirmação de senha divergente da senha)";

      finalizarAguardar(); 
      return false;
    }
    
    // // else if (emailVar == usuario.email) {
    // //   mensagem_erro.innerHTML =
    // //     "(Email já cadastrado)";

    //   finalizarAguardar(); 
    //   return false;
    // }

    else {
      setInterval(sumirMensagem, 5000);
    }

    // // Verificando se o código de ativação é de alguma empresa cadastrada
    // for (let i = 0; i < listaEmpresasCadastradas.length; i++) {

    //     finalizarAguardar();
    //   }
    // }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);



        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
